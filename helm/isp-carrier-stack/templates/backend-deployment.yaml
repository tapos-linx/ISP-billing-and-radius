apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.autoscaling.minReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: backend
      annotations:
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "{{ .Values.vault.role }}"
        vault.hashicorp.com/agent-inject-status: "update"
        vault.hashicorp.com/agent-inject-secret-db_password: "{{ .Values.vault.secretsPath }}"
        vault.hashicorp.com/agent-inject-template-db_password: |
          {{`{{ with secret "`}}{{ .Values.vault.secretsPath }}{{`" }}{{ .Data.data.db_password }}{{ end }}`}}
        vault.hashicorp.com/agent-inject-secret-redis_password: "{{ .Values.vault.secretsPath }}"
        vault.hashicorp.com/agent-inject-template-redis_password: |
          {{`{{ with secret "`}}{{ .Values.vault.secretsPath }}{{`" }}{{ .Data.data.redis_password }}{{ end }}`}}
        vault.hashicorp.com/agent-inject-secret-radius_secret: "{{ .Values.vault.secretsPath }}"
        vault.hashicorp.com/agent-inject-template-radius_secret: |
          {{`{{ with secret "`}}{{ .Values.vault.secretsPath }}{{`" }}{{ .Data.data.radius_secret }}{{ end }}`}}
        vault.hashicorp.com/agent-inject-secret-bkash_secret: "{{ .Values.vault.secretsPath }}"
        vault.hashicorp.com/agent-inject-template-bkash_secret: |
          {{`{{ with secret "`}}{{ .Values.vault.secretsPath }}{{`" }}{{ .Data.data.bkash_secret }}{{ end }}`}}
        {{- end }}
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              value: "{{ .Values.global.environment }}"
            - name: APP_DEBUG
              value: "false"
            - name: DB_HOST
              value: "{{ .Release.Name }}-citus-coordinator"
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: "isp_billing"
            - name: DB_USERNAME
              value: "radius_user"
            - name: REDIS_HOST
              value: "{{ .Release.Name }}-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CLICKHOUSE_HOST
              value: "{{ .Release.Name }}-clickhouse"
            - name: CLICKHOUSE_PORT
              value: "8123"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
