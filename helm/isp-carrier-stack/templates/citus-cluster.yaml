apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-citus-coordinator
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: citus-coordinator
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: citus-coordinator
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-citus-coordinator
spec:
  serviceName: {{ .Release.Name }}-citus-coordinator
  replicas: {{ .Values.citus.coordinator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: citus-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: citus-coordinator
    spec:
      containers:
        - name: coordinator
          image: {{ .Values.citus.coordinator.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "isp_billing"
            - name: POSTGRES_USER
              value: "postgres"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_PASSWORD_FILE
              value: "/run/secrets/db_password"
          resources:
            {{- toYaml .Values.citus.coordinator.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.citus.coordinator.storageSize }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-citus-worker
spec:
  serviceName: {{ .Release.Name }}-citus-worker
  replicas: {{ .Values.citus.workers.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: citus-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: citus-worker
    spec:
      containers:
        - name: worker
          image: {{ .Values.citus.workers.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "isp_billing"
            - name: POSTGRES_USER
              value: "postgres"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_PASSWORD_FILE
              value: "/run/secrets/db_password"
          resources:
            {{- toYaml .Values.citus.workers.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.citus.workers.storageSize }}
