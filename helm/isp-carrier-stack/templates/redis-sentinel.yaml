apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: 6379
      name: redis
    - port: 26379
      name: sentinel
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
spec:
  serviceName: {{ .Release.Name }}-redis
  replicas: {{ .Values.redis.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command:
            - "sh"
            - "-c"
            - |
              AUTH_PASS=$(cat /run/secrets/redis_password | tr -d '\r\n')
              exec redis-server --requirepass "$AUTH_PASS" --masterauth "$AUTH_PASS" --appendonly yes --maxmemory {{ .Values.redis.maxmemory }} --maxmemory-policy {{ .Values.redis.maxmemoryPolicy }}
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: 20Gi
